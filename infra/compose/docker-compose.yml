# Profiles (ADR-18):
#   (none)     infrastructure only: postgres, redis, rabbitmq, mailpit   -> make infra
# Every service runs in Docker (ADR-18); ports are published on localhost for inspection only.
#   full       + every real service container                           -> make up
#   templates  + the Go and Python template services (CI smoke test)
#   obs        + OpenTelemetry collector, Jaeger, Prometheus, Grafana
name: royal-gambit

x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    postgres-init: { condition: service_completed_successfully }
  extra_hosts: ["host.docker.internal:host-gateway"]

services:
  postgres:
    image: postgres:19.0-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:${POSTGRES_PORT}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      retries: 20

  # One-shot: creates any missing per-service database, then exits. Runs on every `up`, so a
  # new service gets its database without resetting the volume.
  postgres-init:
    image: postgres:19.0-trixie
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_DATABASES: template_go template_py auth_profile
    volumes: ["../db/init-databases.sh:/init-databases.sh:ro"]
    command: ["sh", "/init-databases.sh"]
    restart: "no"

  redis:
    image: redis:8.8.4-trixie
    ports: ["127.0.0.1:${REDIS_PORT}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4.1-management-alpine
    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT}:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-rg.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT}:1025"
      - "127.0.0.1:${MAIL_UI_PORT}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      retries: 20

  # ---- services
  # The only public entry: the desktop app talks to http://localhost:8080 and nothing else.
  gateway:
    restart: unless-stopped
    profiles: [full]
    build: ../../services/gateway
    depends_on:
      auth-profile: { condition: service_healthy }
      redis: { condition: service_healthy }
    develop:
      watch:
        - { action: rebuild, path: ../../services/gateway }
    environment:
      PORT: "8080"
      UPSTREAM_AUTH_PROFILE_URL: http://auth-profile:8081
      JWKS_URL: http://auth-profile:8081/.well-known/jwks.json
      REDIS_URL: redis://redis:6379/0
      # Vite dev server, then the packaged app's origins (macOS/Linux, Windows).
      CORS_ORIGINS: http://localhost:1420,tauri://localhost,http://tauri.localhost
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_IN_DOCKER:-}
    ports: ["127.0.0.1:8080:8080"]

  auth-profile:
    <<: *service-defaults
    profiles: [full]
    build: ../../services/auth-profile
    depends_on:
      postgres-init: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    develop:
      watch:
        - { action: rebuild, path: ../../services/auth-profile }
    environment:
      PORT: "8081"
      DATABASE_URL: jdbc:postgresql://postgres:5432/auth_profile
      DATABASE_USER: auth_profile
      DATABASE_PASSWORD: auth_profile
      MIGRATE_ON_START: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: rg
      RABBITMQ_PASSWORD: rg
      # Sign-in codes land in Mailpit (localhost:8025) unless .env names a real SMTP server;
      # see docs/SETUP.md, "Real email in dev". The password only ever lives in .env.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-Royal Gambit <no-reply@royal-gambit.dev>}
      # Dev only: a fresh signing key per start, so tokens die with the container. Real
      # environments set JWT_PRIVATE_KEY from a secret instead.
      JWT_EPHEMERAL_KEY: "true"
    ports: ["127.0.0.1:8081:8081"]

  # ---- templates (copied to create real services; never deployed)
  template-go:
    <<: *service-defaults
    profiles: [templates]
    build: ../../services/_templates/go
    develop:
      watch:
        - { action: rebuild, path: ../../services/_templates/go }
    environment:
      PORT: "8101"
      DATABASE_URL: postgres://template_go:template_go@postgres:5432/template_go?sslmode=disable
      MIGRATE_ON_START: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_IN_DOCKER:-}
    ports: ["127.0.0.1:8101:8101"]

  template-py:
    <<: *service-defaults
    profiles: [templates]
    build: ../../services/_templates/python
    develop:
      watch:
        - { action: rebuild, path: ../../services/_templates/python }
    environment:
      PORT: "8102"
      DATABASE_URL: postgresql+psycopg://template_py:template_py@postgres:5432/template_py
      MIGRATE_ON_START: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_IN_DOCKER:-}
    ports: ["127.0.0.1:8102:8102"]


  # ---- observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles: [obs]
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./obs/otel-collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: [obs]
    ports: ["127.0.0.1:${JAEGER_UI_PORT}:16686"]

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [obs]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT}:9090"]

  grafana:
    image: grafana/grafana:13.3.2
    profiles: [obs]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: ["./obs/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/rg.yaml:ro"]
    ports: ["127.0.0.1:${GRAFANA_PORT}:3000"]

volumes:
  pgdata:
