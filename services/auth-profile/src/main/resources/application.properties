# All runtime values come from environment variables (12-factor).
spring.application.name=${SERVICE_NAME:auth-profile}
server.port=${PORT:8081}
server.shutdown=graceful
spring.threads.virtual.enabled=true

spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USER:}
spring.datasource.password=${DATABASE_PASSWORD:}
# Flyway runs at start-up in dev only; production runs it as a release step (MIGRATE_ON_START=false).
spring.flyway.enabled=${MIGRATE_ON_START:false}

# Errors as RFC 9457 problems; strict JSON input.
spring.mvc.problemdetails.enabled=true
spring.mvc.throw-exception-if-no-handler-found=true
spring.jackson.deserialization.fail-on-unknown-properties=true
# The contract speaks snake_case; Java records keep camelCase.
spring.jackson.property-naming-strategy=SNAKE_CASE

# Access tokens: RS256 with a key from the environment (PKCS#8 PEM). JWT_EPHEMERAL_KEY=true
# makes a throwaway key instead; local dev and tests only.
auth.jwt.private-key=${JWT_PRIVATE_KEY:}
auth.jwt.ephemeral-key=${JWT_EPHEMERAL_KEY:false}
auth.jwt.issuer=${JWT_ISSUER:royal-gambit}

# Sign-in codes go out over SMTP (Mailpit in dev).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
auth.email-code.from=${MAIL_FROM:Royal Gambit <no-reply@royal-gambit.dev>}

# Lichess sign-in (PKCE, no app registration needed). LICHESS_URL is only for tests and
# staging fakes.
auth.lichess.base-url=${LICHESS_URL:https://lichess.org}
auth.lichess.client-id=${LICHESS_CLIENT_ID:royal-gambit}

# Events: outbox rows go to the rg.events topic exchange with publisher confirms. RabbitMQ is
# not part of readiness on purpose: sign-in keeps working while the broker is down and the
# outbox catches up later.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=simple
auth.events.exchange=rg.events
auth.outbox.poll=${OUTBOX_POLL:PT1S}

# Metrics are scraped from /metrics (Prometheus). The OpenTelemetry starter would also push
# them over OTLP every minute, and log an error each time no collector is listening.
management.otlp.metrics.export.enabled=false

# Health on /health/live and /health/ready, Prometheus on /metrics.
management.endpoints.web.base-path=/
management.endpoints.web.discovery.enabled=false
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.additional-path=server:/health/live
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.additional-path=server:/health/ready

# Tracing: W3C propagation, every request sampled. Export when the endpoint is set.
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c

# JSON logs with trace_id.
logging.structured.format.console=logstash
logging.structured.json.rename.traceId=trace_id
logging.structured.json.rename.spanId=span_id
logging.structured.json.add.service=${spring.application.name}
