openapi: 3.1.0
info:
  title: Template service (example contract)
  version: 1.0.0
  description: |
    The contract every language template implements identically. A new service copies a
    template, deletes the `items` example and writes its own `contracts/openapi/<name>.yaml` first.
paths:
  /health/live:
    get:
      operationId: live
      responses:
        "200": { description: Process is up, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /health/ready:
    get:
      operationId: ready
      responses:
        "200": { description: Dependencies reachable, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
        "503": { description: A dependency is down, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /v1/items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewItem" }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/items/{id}:
    get:
      operationId: getItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Found
          content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }
    NewItem:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    Item:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, format: uuid, description: UUIDv7 }
        name: { type: string }
        created_at: { type: string, format: date-time, description: UTC }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        trace_id: { type: string }
