[package]
name = "royale-gambit-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
# Desktop links the rlib only. "staticlib" and "cdylib" are for iOS and Android: they cost ~1.1 GB
# per debug build (and again per test and clippy build), so they come back in M18 (Mobile).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
tauri-plugin-opener = "2"
thiserror = "2"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rusqlite_migration = "2.9.0"
getrandom = "0.3"


# Dev and test builds: full debug info for ~400 dependencies is most of the target folder and is
# never read. Our own crate keeps file:line tables so panics and backtraces still point at code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
