name: release

# Push a tag like v0.1.0 to publish a GitHub release with generated notes and the service
# images on GHCR. Desktop installers join this workflow in M7.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: template-go, dir: services/_templates/go }
          - { name: template-py, dir: services/_templates/python }
          - { name: template-java, dir: services/_templates/java }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.ref_name }}

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            $([[ "$GITHUB_REF_NAME" == v0.* ]] && echo --prerelease)
