name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
      any: ${{ steps.filter.outputs.changes != '[]' }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # One filter per service folder; add a line when a service is created.
          filters: |
            python: ['services/_templates/python/**']
            auth-profile: ['services/auth-profile/**', 'contracts/openapi/auth-profile.yaml', 'contracts/events/**']
            gateway: ['services/gateway/**']
            analysis: ['services/analysis/**', 'contracts/openapi/analysis.yaml', 'contracts/fixtures/uci/**', 'contracts/fixtures/pgn/**']
            infra: ['infra/**', 'contracts/**', 'Makefile', 'scripts/**', '.github/workflows/**']
      - id: list
        run: echo "services=$(jq -c 'map(select(. != "infra"))' <<< '${{ steps.filter.outputs.changes }}')" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5
      - name: Checks inside the service toolchain image (ADR-18)
        run: make check-svc S=${{ matrix.service }}
      - name: Build the runtime image
        # Real services live in services/<name>; the language templates in services/_templates/<name>.
        run: |
          dir=services/${{ matrix.service }}
          [ -d "$dir" ] || dir=services/_templates/${{ matrix.service }}
          docker build -t rg/${{ matrix.service }}:ci "$dir"

  smoke:
    needs: [changes, check]
    if: ${{ always() && !failure() && !cancelled() && needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compose smoke test and contract check
        run: make smoke
